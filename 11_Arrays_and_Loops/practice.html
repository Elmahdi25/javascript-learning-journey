<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>practice Arrays</title>
</head>

<body>
    <h1>Todo List practice 1</h1>
    <input 
        onkeydown="handle_enter_btn(event)" 
        class="todo_value"  
        type="text" 
        placeholder="Todo name"
    >
    <button onclick="add_btn()">Add</button>
    <script>
        let todo_array = [];


        function add_btn() {
            let todo_value = document.querySelector('.todo_value');
            todo_array.push(todo_value.value);
            todo_value.value = '';
            console.log(todo_array);

        }

        function handle_enter_btn(event) {
            if (event.key === 'Enter') {
                add_btn();
            }
        }
    </script>
</body>

</html>
