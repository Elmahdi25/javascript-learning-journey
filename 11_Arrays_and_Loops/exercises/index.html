    <h1>ARRAYS LOOPS APPLICATION</h1>
    <script>
        /*EX--13- WHILE-LOOP*/
        console.log("-------EX--13----------");
        function count_words(words_array) {
            let object_words = {};
            for (let i = 0; i < words_array.length; i++) {
                const element = words_array[i];
                object_words[element] = 0;
                for (let j = 0; j < words_array.length; j++) {
                    const element_2 = words_array[j];
                    if (element === element_2) {
                        object_words[element]++;
                    }
                }
            }


            console.log(object_words);
        }


        let words_array = ['elmahdi', 'raid', 'dina', 'fati', 'elmahdi', 'fati','nourdin','elmahdi'];
        count_words(words_array);



    </script>
