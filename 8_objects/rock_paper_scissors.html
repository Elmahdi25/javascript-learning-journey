<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rock_paper_scissors</title>
</head>

<body>
    <h1>Rock Paper Scissors With objects</h1>

    <button onclick="play('rock')">Rock</button>
    <button onclick="play('paper')">Paper</button>
    <button onclick="play('scissors')">Scissors</button>
    <button onclick="show_score()">Show Score</button>
    <button onclick="reset_score()">Reset Score</button>


    <script>
        let score = {
            wins: 0,
            loses: 0,
            tie: 0
        };

        function play(play_move) {
            const robot_move = pick_robot_move();
            let result = '';

            if (play_move === 'rock') {
                if (robot_move === 'rock') {
                    result = 'Tie';
                } else if (robot_move === 'paper') {
                    result = 'You Lose';
                } else {
                    result = 'You Win';
                }
            } else if (play_move === 'scissors') {
                if (robot_move === 'rock') {
                    result = 'You Lose';
                } else if (robot_move === 'paper') {
                    result = 'You Win';
                } else {
                    result = 'Tie';
                }
            } else {
                if (robot_move === 'rock') {
                    result = 'You Win';
                } else if (robot_move === 'paper') {
                    result = 'Tie';
                } else {
                    result = 'You Lose';
                }
            }

            if (result === 'You Win') {
                score.wins++;
            } else if (result === 'You Lose') {
                score.loses++;
            } else if (result === 'Tie') {
                score.tie++;
            }

            alert(`You picked ${play_move}, robot picked ${robot_move}. ${result}.\nWins: ${score.wins}, Loses: ${score.loses}, Ties: ${score.tie}`)
        }


        function pick_robot_move() {
            let robot_move = ''
            let random_nbr = Math.random();

            if (random_nbr >= 0 && random_nbr < 1 / 3) {
                robot_move = 'rock'
            } else if (random_nbr >= 1 / 3 && random_nbr < 2 / 3) {
                robot_move = 'paper'
            } else {
                robot_move = 'scissors'
            }
            return robot_move;
        }

        function show_score() {
            alert(`Score:\nWins: ${score.wins}, Loses: ${score.loses}, Ties: ${score.tie}`)
        }

        function reset_score() {
            score.wins =0;
            score.loses =0;
            score.tie =0;
            show_score() ;
        }
    </script>
</body>

</html>
