<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>

<body>
    <p>
        <button onclick="update_calculation('1')">1</button>
        <button onclick="update_calculation('2')">2</button>
        <button onclick="update_calculation('3')">3</button>

        <button onclick="update_operations('+')">+</button>
    </p>

    <p>
        <button onclick="update_calculation('4')">4</button>
        <button onclick="update_calculation('5')">5</button>
        <button onclick="update_calculation('6')">6</button>

        <button onclick="update_operations('-')">-</button>

    </p>

    <p>
        <button onclick="update_calculation('7')">7</button>
        <button onclick="update_calculation('8')">8</button>
        <button onclick="update_calculation('9')">9</button>

        <button onclick="update_operations('*')">*</button>

    </p>
    <p>
        <button onclick="update_calculation('0')">0</button>

        <button onclick="update_calculation('.')">.</button>

        <button onclick="update_operations('=')"> =</button>

        <button onclick="update_operations('/')"> /</button>

    </p>
    <p>
        <button onclick="update_operations('clear')"> Clear
        </button>
    </p>





    <script>
        let calculation = ''
        function update_calculation(number) {
            if (number === '1') {
                calculation += '1';
            } else if (number === '2') {
                calculation += '2';
            } else if (number === '3') {
                calculation += '3';
            } else if (number === '4') {
                calculation += '4';
            } else if (number === '5') {
                calculation += '5';
            } else if (number === '6') {
                calculation += '6';
            } else if (number === '7') {
                calculation += '7';
            } else if (number === '8') {
                calculation += '8';
            } else if (number === '9') {
                calculation += '9';
            } else if (number === '0') {
                calculation += '0';
            }
            console.log(calculation);
        }

        function update_operations(operation) {
            if (operation === '+') {
                calculation += '+';
            } else if (operation === '-') {
                calculation += '-';
            } else if (operation === '*') {
                calculation += '*';
            } else if (operation === '/') {
                calculation += '/';
            } else if (operation === '=') {
                calculation = eval(calculation);
            } else if (operation === 'clear'){
                calculation = '';
                console.log('Cleared');
            }
            console.log(calculation);
        }
    </script>
</body>

</html>
