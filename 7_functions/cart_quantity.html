<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Variables</title>
</head>

<body>
    <!--OPEN INSPECT in GOOGLE CHROME-->

    <h1>Cart Quantity</h1>

    <button class="show_quantity" onclick="update_quantity('show_quantity')">Show Quantity</button>


    <button onclick="update_quantity('add_to_cart')">Add to cart</button>
    <button onclick="update_quantity('2')">+2</button>
    <button onclick="update_quantity('3')">+3</button>
    <button onclick="update_quantity('4')">+4</button>
    <button onclick="update_quantity('5')">+5</button>

    <button onclick="update_quantity('remove_from_cart')" class="remove">Remove from cart</button>
    <button class="remove" onclick="update_quantity('-2')">-2</button>
    <button class="remove" onclick="update_quantity('-3')">-3</button>


    <button class="reset" onclick=" update_quantity('reset')">Reset</button>

    <button class="confirm" onclick="confirm_items()">Confirm</button>
    <script>

        let quantity = 0;

        function update_quantity(nbr_quantity) {
            if (nbr_quantity === 'show_quantity') {
                console.log(`Cart quantity: ${quantity}`);
            } else if (nbr_quantity === 'add_to_cart') {
                if (!(quantity + 1 <= 10)) {
                    alert('The cart is Full')
                    return;
                }
                quantity++;
                console.log(`Cart quantity: ${quantity}`);
            } else if (nbr_quantity === '2') {
                if (!(quantity + 2 <= 10)) {
                    alert('The cart is Full')
                    return;
                }
                quantity += 2;
                console.log(`Cart quantity: ${quantity}`);
            } else if (nbr_quantity === '3') {
                if (!(quantity + 3 <= 10)) {
                    alert('The cart is Full')
                    return;
                }
                quantity += 3;
                console.log(`Cart quantity: ${quantity}`);
            } else if (nbr_quantity === '4') {
                if (!(quantity + 4 <= 10)) {
                    alert('The cart is Full')
                    return;
                }
                quantity += 4;
                console.log(`Cart quantity: ${quantity}`);
            } else if (nbr_quantity === '5') {
                if (!(quantity + 5 <= 10)) {
                    alert('The cart is Full')
                    return;
                }
                quantity += 5;
                console.log(`Cart quantity: ${quantity}`);
            } else if (nbr_quantity === 'remove_from_cart') {
                if (!(quantity - 1 >= 0)) {
                    alert('Not enough Items in the Cart')
                    return;
                }
                quantity--;
                console.log(`Cart quantity: ${quantity}`);
            } else if (nbr_quantity === '-2') {
                if (!(quantity - 2 >= 0)) {
                    alert('Not enough Items in the Cart')
                    return;
                }
                quantity -= 2;
                console.log(`Cart quantity: ${quantity}`);
            } else if (nbr_quantity === '-3') {
                if (!(quantity - 3 >= 0)) {
                    alert('Not enough Items in the Cart')
                    return;
                }
                quantity -= 3;
                console.log(`Cart quantity: ${quantity}`);
            } else if (nbr_quantity === 'reset') {
                quantity = 0;
                console.log('Cart was reset, Feel free to choose again');
                console.log(`Cart quantity: ${quantity}`);
            }
        }
        
        function confirm_items() {
           
            if (quantity === 0) {
                alert('Please confirm at leat 1 Item');
                return;
            }

            if (quantity === 1) {
                alert(`Your ${quantity} Item is confirmed, Thank your for visit`);
                quantity =0;
                return;
            }

            alert(`Your ${quantity} Items are confirmed, Thank your for visit`)
            quantity = 0;
        }
    </script>
</body>

</html>
